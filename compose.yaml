services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-attendance}
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app} -d ${DB_NAME:-attendance}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${DB_USER:-app}:${DB_PASSWORD}@db:5432/${DB_NAME:-attendance}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      SMTP_URL: ${SMTP_URL:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    ports:
      - "3000:3000"

  # 任意：非同期/バッチ処理を API から分離したい場合に有効化する。
  # 小規模なら backend に内包されるため不要。
  worker:
    build: ./backend
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${DB_USER:-app}:${DB_PASSWORD}@db:5432/${DB_NAME:-attendance}
      SMTP_URL: ${SMTP_URL:-}
      WORKER_STANDALONE: "true"
      AUTO_MIGRATE: "false"
    depends_on:
      db:
        condition: service_healthy
    profiles: ["worker"]

  # Next.js フロントエンド。/api/v1 を backend へプロキシ（セッション Cookie 共有）。
  frontend:
    build: ./frontend
    environment:
      NODE_ENV: production
      BACKEND_ORIGIN: http://backend:3000
      PORT: "8080"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  db-data:
