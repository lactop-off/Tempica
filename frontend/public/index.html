<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tempica — 準備中</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #f8fafc; color: #0f172a;
             display: grid; place-items: center; min-height: 100vh; margin: 0; }
      .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px;
              padding: 40px 48px; max-width: 520px; box-shadow: 0 10px 30px rgba(2,6,23,.06); }
      h1 { color: #2563eb; margin: 0 0 8px; font-size: 28px; }
      p { line-height: 1.7; color: #475569; }
      code { background: #f1f5f9; padding: 2px 6px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Tempica</h1>
      <p>汎用勤怠管理システム — フロントエンドはデザイン確定後に実装予定です。</p>
      <p>バックエンド API は <code>/api/v1</code>、API ドキュメントは <code>/api/docs</code> で稼働しています。</p>
    </div>
  </body>
</html>
